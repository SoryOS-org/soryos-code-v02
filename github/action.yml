name: "lutungcode GitHub Action"
description: "Run lutungcode in GitHub Actions workflows"
branding:
  icon: "code"
  color: "orange"

inputs:
  model:
    description: "Model to use"
    required: true

  agent:
    description: "Agent to use. Must be a primary agent. Falls back to default_agent from config or 'build' if not found."
    required: false

  share:
    description: "Share the lutungcode session (defaults to true for public repos)"
    required: false

  prompt:
    description: "Custom prompt to override the default prompt"
    required: false

  use_github_token:
    description: "Use GITHUB_TOKEN directly instead of LutungCode App token exchange. When true, skips OIDC and uses the GITHUB_TOKEN env var."
    required: false
    default: "false"

  mentions:
    description: "Comma-separated list of trigger phrases (case-insensitive). Defaults to '/lutungcode,/oc'"
    required: false

  variant:
    description: "Model variant for provider-specific reasoning effort (e.g., high, max, minimal)"
    required: false

  oidc_base_url:
    description: "Base URL for OIDC token exchange. Required for GitHub App token exchange; unset until a LutungCode endpoint is configured."
    required: false

runs:
  using: "composite"
  steps:
    - name: Install lutungcode
      shell: bash
      run: |
        if [ -z "${LUTUNGCODE_INSTALL_URL:-}" ]; then
          echo 'LutungCode install URL is not configured'
          exit 1
        fi
        curl -fsSL "$LUTUNGCODE_INSTALL_URL" | bash

    - name: Add lutungcode to PATH
      shell: bash
      run: echo "$HOME/.lutungcode/bin" >> $GITHUB_PATH

    - name: Run lutungcode
      shell: bash
      id: run_lutungcode
      run: lutungcode github run
      env:
        MODEL: ${{ inputs.model }}
        AGENT: ${{ inputs.agent }}
        SHARE: ${{ inputs.share }}
        PROMPT: ${{ inputs.prompt }}
        USE_GITHUB_TOKEN: ${{ inputs.use_github_token }}
        MENTIONS: ${{ inputs.mentions }}
        VARIANT: ${{ inputs.variant }}
        OIDC_BASE_URL: ${{ inputs.oidc_base_url }}
