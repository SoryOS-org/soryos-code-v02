name: lutungcode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  lutungcode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /lutungcode') ||
      startsWith(github.event.comment.body, '/lutungcode')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun

      - name: Run lutungcode
        uses: ./github
        env:
          LUTUNGCODE_API_KEY: ${{ secrets.LUTUNGCODE_API_KEY }}
          LUTUNGCODE_PERMISSION: '{"bash": "deny"}'
        with:
          model: lutungcode/claude-opus-4-5
