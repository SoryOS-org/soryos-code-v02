name: Custom provider verification (fork only)

on:
  push:
    branches: [custom-provider-save]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custom-provider-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'WhoCares1337/opencode'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify generated clients
        working-directory: packages/client
        run: bun run check:generated
      - name: Schema tests
        working-directory: packages/schema
        run: bun run test
      - name: Core tests
        working-directory: packages/core
        run: bun run test
      - name: App tests
        working-directory: packages/app
        run: bun run test
      - name: Lint and type checks
        run: bun run check
